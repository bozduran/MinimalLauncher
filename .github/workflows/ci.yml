name: CI

# Runs on the same commands a contributor would use locally, via the Gradle
# wrapper committed in PERF-1 — no system Gradle, no Android Studio.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Handles the Gradle wrapper and caches the dependency/configuration caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # QA-1, QA-2: TextNormalizer, DataStoreSettingsRepository, AppListOrdering,
      # LauncherViewModel and PaletteContrast tests are all plain JVM tests.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # PERF-2: R8 runs only in the release build, so it must be exercised here or
      # a keep-rule regression would ship unnoticed.
      - name: Assemble release (R8 + resource shrinking)
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # QA-3: the Compose UI suite cannot run on the build machine, so it runs on an
      # emulator here. This is the only place the instrumented tests are executed;
      # they are deliberately not runnable locally in every environment.
      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/test-results/
          if-no-files-found: ignore

# Still not wired up (see USER_STORIES.md):
#   - A release signing/upload job needs keystore secrets; assembleRelease above
#     deliberately produces an unsigned artifact so it can run without them.
#   - PERF-3 baseline profiles would be generated and measured in this pipeline once
#     the profile module exists.
